
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>Thanaphon Video Downloader</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#101827,#19365b);
 color:white;
 min-height:100vh;
}
header{text-align:center;padding:35px 15px}
.logo{font-size:48px}
h1{font-size:23px}
header p{color:#b6c7dc}
.container{max-width:620px;margin:auto;padding:15px}
.panel{
 background:white;color:#172033;
 padding:24px;border-radius:20px;
 box-shadow:0 15px 40px #0005;
}
input{
 width:100%;padding:16px;
 border:1px solid #ccd5e1;
 border-radius:10px;font-size:15px;
 margin:12px 0;
}
button{
 width:100%;padding:15px;
 border:0;border-radius:10px;
 background:#2563eb;color:white;
 font-size:16px;font-weight:bold;
 margin-top:10px;
}
button:disabled{opacity:.5}
.green{background:#059669}
video{width:100%;margin-top:20px;border-radius:12px;background:#000}
#status{margin-top:15px;line-height:1.7;font-size:14px;overflow-wrap:anywhere}
.note{
 background:#eff6ff;color:#1e40af;
 padding:13px;border-radius:10px;
 font-size:13px;margin-top:20px;
 line-height:1.6
}
footer{text-align:center;padding:25px;color:#b6c7dc;font-size:12px}
.hidden{display:none}
</style>
</head>

<body>

<header>
<div class="logo">🎬</div>
<h1>THANAPHON VIDEO DOWNLOADER</h1>
<p>Online Video Downloader</p>
</header>

<div class="container">
<div class="panel">

<h2>ดาวน์โหลดวิดีโอออนไลน์</h2>
<p>วางลิงก์วิดีโอหรือ URL เว็บไซต์</p>

<input id="url" type="url"
placeholder="https://example.com/video.mp4">

<button id="detect" onclick="detectVideo()">
🔍 ตรวจจับวิดีโอ
</button>

<div id="status" aria-live="polite">
พร้อมใช้งาน กรุณาวางลิงก์วิดีโอ
</div>

<video id="player" controls playsinline
preload="metadata" class="hidden"></video>

<button id="download" class="green hidden"
onclick="downloadVideo()">
⬇ ดาวน์โหลดวิดีโอ
</button>

<div class="note">
รองรับไฟล์วิดีโอที่เข้าถึงได้โดยตรง
เว็บไซต์ที่จำกัด CORS หรือใช้ DRM
อาจต้องใช้ Backend ที่ได้รับอนุญาต
</div>

</div>
</div>

<footer>© 2026 THANAPHON VIDEO DOWNLOADER</footer>

<script>
let videoURL = "";
let videoType = "";

const $ = id => document.getElementById(id);

function message(text){
 $("status").textContent = text;
}

function reset(){
 $("player").pause();
 $("player").removeAttribute("src");
 $("player").load();
 $("player").classList.add("hidden");
 $("download").classList.add("hidden");
 videoURL = "";
 videoType = "";
}

function validURL(value){
 try{
  const u = new URL(value);
  return ["http:","https:"].includes(u.protocol) ? u : null;
 }catch(e){
  return null;
 }
}

function detectVideo(){
 reset();

 const u = validURL($("url").value.trim());

 if(!u){
  message("กรุณาใส่ URL ที่ถูกต้อง");
  return;
 }

 videoURL = u.href;

 const ext = u.pathname.toLowerCase().split(".").pop();

 const extensions = {
  mp4:"video/mp4",
  webm:"video/webm",
  mov:"video/quicktime",
  m4v:"video/x-m4v",
  ogv:"video/ogg"
 };

 videoType = extensions[ext] || "";

 message("กำลังตรวจสอบไฟล์วิดีโอ...");

 const player = $("player");

 player.onloadedmetadata = () => {
  message("ตรวจพบวิดีโอสำเร็จ สามารถทดลองเล่นได้");
  $("download").classList.remove("hidden");
 };

 player.onerror = () => {
  player.classList.add("hidden");
  message(
   "ไม่สามารถตรวจจับวิดีโอได้ อาจเป็น URL ของหน้าเว็บ ไม่ใช่ไฟล์วิดีโอโดยตรง หรือเซิร์ฟเวอร์ไม่อนุญาตให้เข้าถึง"
  );
 };

 player.src = videoURL;
 player.classList.remove("hidden");
 player.load();

 // ถ้าไฟล์ไม่มีนามสกุล ให้ตรวจสอบ Content-Type
 if(!videoType){
  message(
   "กำลังตรวจสอบรูปแบบไฟล์จากเซิร์ฟเวอร์..."
  );
 }
}

async function downloadVideo(){
 if(!videoURL) return;

 const button = $("download");
 button.disabled = true;

 message("กำลังเตรียมดาวน์โหลด...");

 try{
  const response = await fetch(videoURL);

  if(!response.ok){
   throw new Error("HTTP "+response.status);
  }

  const blob = await response.blob();

  if(!blob.type.startsWith("video/") &&
     !videoType){
   throw new Error("ไฟล์ไม่ใช่วิดีโอ");
  }

  const objectURL = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = objectURL;
  a.download = "video." +
   (videoURL.match(/\.(mp4|webm|mov|m4v|ogv)(?:$|[?#])/i)?.[1] || "mp4");

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(()=>URL.revokeObjectURL(objectURL),60000);

  message("เริ่มดาวน์โหลดแล้ว");

 }catch(error){
  message(
   "ดาวน์โหลดไม่ได้: "+error.message+
   " กรุณาตรวจสอบ CORS หรือใช้ช่องทางดาวน์โหลดจากเซิร์ฟเวอร์ต้นทาง"
  );
 }finally{
  button.disabled = false;
 }
}
</script>

</body>
</html>
